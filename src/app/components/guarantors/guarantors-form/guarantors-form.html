<div class="guarantors" [formGroup]="form" dir="rtl" aria-labelledby="guarantorsTitle">
  <header class="header">
    <h2 id="guarantorsTitle" class="title">פירוט ערבים</h2>
    <p class="subtitle">
      לצורך אישור הבקשה הנהלת הגמ"ח מאשרת את הערבים. מלאי את פרטיהם.
    </p>
  </header>

  <div class="grid" formArrayName="guarantors">
    <div class="col" *ngFor="let g of guarantorFormGroups; let i = index" [formGroupName]="i">
      <div class="pill title-pill">ערב {{ i + 1 }}</div>

      <div class="field">
        <input formControlName="firstName" type="text" placeholder="שם פרטי" />
        <span class="err" *ngIf="g.get('firstName')?.errors?.['server'] as e">{{ e }}</span>
      </div>

      <div class="field">
        <input formControlName="lastName" type="text" placeholder="שם משפחה" />
        <span class="err" *ngIf="g.get('lastName')?.errors?.['server'] as e">{{ e }}</span>
      </div>

      <div class="field">
        <input formControlName="idNumber" type="text" placeholder="תעודת זהות" />
        <span class="err" *ngIf="g.get('idNumber')?.errors?.['server'] as e">{{ e }}</span>
      </div>

      <div class="field">
        <input formControlName="phone" type="text" placeholder="טלפון" />
        <span class="err" *ngIf="g.get('phone')?.errors?.['server'] as e">{{ e }}</span>
      </div>

      <div class="field">
        <input formControlName="occupation" type="text" placeholder="עיסוק" />
        <span class="err" *ngIf="g.get('occupation')?.errors?.['server'] as e">{{ e }}</span>
      </div>

      <div class="field">
        <input formControlName="city" type="text" placeholder="עיר" />
        <span class="err" *ngIf="g.get('city')?.errors?.['server'] as e">{{ e }}</span>
      </div>

      <div class="field">
        <input formControlName="street" type="text" placeholder="רחוב" />
        <span class="err" *ngIf="g.get('street')?.errors?.['server'] as e">{{ e }}</span>
      </div>

      <div class="field">
        <input formControlName="houseNumber" type="text" placeholder="מספר בית" />
        <span class="err" *ngIf="g.get('houseNumber')?.errors?.['server'] as e">{{ e }}</span>
      </div>

      <div class="field">
        <input formControlName="loanLink" type="text" placeholder="קרבה ללווה" />
        <span class="err" *ngIf="g.get('loanLink')?.errors?.['server'] as e">{{ e }}</span>
      </div>

      <div class="field">
        <input formControlName="email" type="email" placeholder="אימייל" />
        <span class="err" *ngIf="g.get('email')?.errors?.['server'] as e">{{ e }}</span>
      </div>
    </div>
  </div>

  <div class="divider" aria-hidden="true"></div>

  <div class="actions">
    <button type="button" class="btn-outline" (click)="addGuarantor()">הוסף ערב</button>
  </div>
</div>
