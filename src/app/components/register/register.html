<section class="register-page" dir="rtl">
  <!-- פס כחלחל קבוע -->
  <div class="blue-band" aria-hidden="true"></div>

  <div class="form-shell">
    <div class="card">

      <!-- כותרת + קישור – בתוך הכרטיס -->
      <header class="header header--in-card">
        <h1 class="title">{{ institution.name }} | הרשמה</h1>
        <p class="sub">משתמש קיים? <a routerLink="/login">לחץ להתחברות</a></p>
      </header>

      <form
        [formGroup]="form"
        (ngSubmit)="onSubmit()"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
      >
        <div class="form-grid">

          <mat-form-field appearance="fill" class="cc-field">
            <mat-label>שם פרטי</mat-label>
            <input matInput formControlName="FirstName" required />
          </mat-form-field>

          <mat-form-field appearance="fill" class="cc-field">
            <mat-label>שם משפחה</mat-label>
            <input matInput formControlName="LastName" required />
          </mat-form-field>

          <mat-form-field appearance="fill" class="cc-field">
            <mat-label>תעודת זהות</mat-label>
            <input matInput formControlName="ID" required inputmode="numeric" autocomplete="off" />
          </mat-form-field>

          <mat-form-field appearance="fill" class="cc-field">
            <mat-label>טלפון</mat-label>
            <input matInput formControlName="PhoneNumber" inputmode="tel" autocomplete="off" />
          </mat-form-field>

          <mat-form-field appearance="fill" class="cc-field">
            <mat-label>נייד</mat-label>
            <input matInput formControlName="LandlineNumber" inputmode="tel" autocomplete="off" />
          </mat-form-field>

          <mat-form-field appearance="fill" class="cc-field">
            <mat-label>דוא"ל</mat-label>
            <input matInput formControlName="Email" required autocomplete="off" />
          </mat-form-field>

          <!-- סטטוס -->
          <mat-form-field appearance="fill" class="cc-field cc-select">
            <mat-label>סטטוס</mat-label>
            <mat-select formControlName="PersonalStatus" required>
              <mat-option *ngFor="let s of statuses" [value]="s">{{ s }}</mat-option>
            </mat-select>
            <span matSuffix class="cc-suffix">
              <svg viewBox="0 0 12.74 6.74" width="12.74" height="6.74" fill="none"
                   stroke="#192A4A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 1 L6.37 5.74 L11.74 1"></path>
              </svg>
            </span>
          </mat-form-field>

          <!-- תאריך לידה -->
          <mat-form-field appearance="fill" class="cc-field cc-date">
            <mat-label>תאריך לידה</mat-label>
            <input matInput [matDatepicker]="picker" formControlName="DateOfBirth" autocomplete="off" />
            <mat-datepicker-toggle matSuffix [for]="picker" class="cc-suffix cc-date-toggle">
              <svg matDatepickerToggleIcon viewBox="0 0 32 33" width="31" height="32.8" fill="none"
                   stroke="#192A4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="6" width="26" height="24" rx="4"/>
                <line x1="3" y1="12" x2="29" y2="12"/>
                <line x1="10" y1="3" x2="10" y2="9"/>
                <line x1="22" y1="3" x2="22" y2="9"/>
                <circle cx="11" cy="18" r="1.6"/>
                <circle cx="16" cy="18" r="1.6"/>
                <circle cx="21" cy="18" r="1.6"/>
              </svg>
            </mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
          </mat-form-field>

          <mat-form-field appearance="fill" class="cc-field">
            <mat-label>עיר</mat-label>
            <input matInput formControlName="City" required autocomplete="off" />
          </mat-form-field>

          <mat-form-field appearance="fill" class="cc-field">
            <mat-label>רחוב</mat-label>
            <input matInput formControlName="Street" required autocomplete="off" />
          </mat-form-field>

          <mat-form-field appearance="fill" class="cc-field">
            <mat-label>מספר בית</mat-label>
            <input matInput formControlName="HouseNumber" required autocomplete="off" />
          </mat-form-field>

          <mat-form-field appearance="fill" class="cc-field">
            <mat-label>סיסמה</mat-label>
            <input matInput type="password" formControlName="Password" required autocomplete="new-password" />
          </mat-form-field>

          <mat-form-field appearance="fill" class="cc-field cc-field--confirm">
            <mat-label>אימות סיסמה</mat-label>
            <input matInput type="password" formControlName="ConfirmPassword" required autocomplete="new-password" />
          </mat-form-field>

          <button type="submit" class="cta cta--form" [disabled]="form.pending || form.invalid">
            <span class="cta__text">שלח טופס</span>
            <span class="cta__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="none"
                   stroke="#F6F6F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H6M6 12l6-6M6 12l6 6"></path>
              </svg>
            </span>
          </button>

        </div>
      </form>
    </div>
  </div>
</section>
