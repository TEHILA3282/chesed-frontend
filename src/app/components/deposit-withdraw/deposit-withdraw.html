<!-- WithdrawDepositComponent.html -->
<section class="withdraw-screen" dir="rtl" aria-labelledby="withdrawTitle">
  <!-- רצועה כחולה צמודה לתחתית -->
  <div class="bottom-band" aria-hidden="true"></div>

  <form
    #withdrawForm="ngForm"
    class="card"
    (ngSubmit)="onSubmit(withdrawForm)"
    novalidate
  >
    <!-- כותרת ראשית -->
    <h2 id="withdrawTitle" class="main-title">בקשה למשיכת הפקדה</h2>

    <!-- תת־כותרת עם קו תחתון -->
    <p class="subtitle">מבקש לבצע משיכה מתיקי ההפקדות שברשותי</p>

    <!-- שדה סכום -->
    <div class="field">
      <input
        class="input input--single"
        type="number"
        name="amount"
        [(ngModel)]="amount"
        min="1"
        required
        autocomplete="off"
        placeholder=" "
      />
      <span class="field-note">* סכום</span>
    </div>

    <!-- שדה פירוט -->
    <div class="field textarea">
      <textarea
        class="input input--area"
        name="requestText"
        [(ngModel)]="requestText"
        rows="5"
        required
        placeholder=" "
      ></textarea>
      <span class="field-note">* נא פרט את בקשתך</span>
    </div>

    <!-- כפתור גלולתי עם מסגרת -->
    <button
      type="submit"
      class="submit-btn"
      [disabled]="loading || withdrawForm.invalid"
    >
      {{ loading ? 'שולח...' : 'שליחה' }}
    </button>
  </form>
</section>
