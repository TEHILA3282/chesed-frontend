<section class="loan-page" dir="rtl" aria-labelledby="loanTitle">
  <header class="loan-header">
    <h2 id="loanTitle" class="main-title">{{ loanTypeTitle }}</h2>
    <p class="subtitle">{{ subtitleText }}</p>
  </header>

  <article class="loan-card" aria-label="טופס בקשה">
    <form #loanForm="ngForm" (ngSubmit)="onSubmit()" class="form-wrapper" autocomplete="off">

      <!-- על סך -->
      <mat-form-field appearance="fill" floatLabel="auto" class="field">
        <mat-label>על סך</mat-label>
        <input matInput type="number" [(ngModel)]="amount" name="amount" required />
      </mat-form-field>

      <!-- מספר תשלומים -->
      <mat-form-field appearance="fill" floatLabel="auto" class="field" [hidden]="isBridge">
        <mat-label>מספר תשלומים</mat-label>
        <input matInput type="number" [(ngModel)]="paymentsCount" name="paymentsCount" required />
      </mat-form-field>

      <!-- מטרה -->
      <mat-form-field appearance="fill" floatLabel="auto" class="field">
        <mat-label>לאיזו מטרה ההלוואה?</mat-label>
        <mat-select [(ngModel)]="loanPurpose" name="loanPurpose" required>
          <mat-option *ngFor="let purpose of loanPurposes" [value]="purpose">{{ purpose }}</mat-option>
        </mat-select>
      </mat-form-field>

      <!-- תיאור -->
      <mat-form-field appearance="fill" floatLabel="auto" class="field textarea">
        <mat-label>{{ detailsLabel }}</mat-label>
        <textarea
          matInput
          [(ngModel)]="description"
          name="description"
          rows="4"
          [placeholder]="detailsPlaceholder"
          required
        ></textarea>
        <mat-hint *ngIf="detailsHelper">{{ detailsHelper }}</mat-hint>
      </mat-form-field>

      <!-- האם ההלוואה לדירה -->
      <div class="question">
        <label class="question__label">האם ההלוואה לדירה?</label>

        <mat-radio-group class="question__radios" [(ngModel)]="isForApartment" name="isForApartment" required>
          <mat-radio-button class="radio" value="yes">כן</mat-radio-button>
          <mat-radio-button class="radio" value="no">לא</mat-radio-button>
        </mat-radio-group>
      </div>

      <!-- פירוט ואישור -->
      <div class="apartment-details" *ngIf="isForApartment === 'yes'">
        <p class="apartment-details__text">
          קופת הגמ"ח תגבה באופן חד פעמי סכום של 15 ש"ח מחשבון הבנק של המבקש לצורך אימות ענין הרכישה
        </p>
        <mat-checkbox class="confirm" [(ngModel)]="apartmentConfirmed" name="apartmentConfirmed">
          מאשר/ת
        </mat-checkbox>
      </div>

      <!-- ערבים -->
      <div class="guarantors-grid">
        <app-guarantors-form (guarantorsChange)="onGuarantorsChange($event)"></app-guarantors-form>
      </div>

      <!-- כפתור שליחה -->
      <div class="actions">
        <button
          class="submit-btn"
          type="submit"
          [disabled]="loanForm.invalid || (isForApartment === 'yes' && !apartmentConfirmed)"
        >
          אישור
        </button>
      </div>
    </form>
  </article>
</section>
