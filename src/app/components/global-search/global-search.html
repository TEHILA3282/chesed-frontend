<div class="search-wrapper">
  <input
    type="text"
    [(ngModel)]="searchTerm"
    (input)="onInputChange()"
    (keyup.enter)="onSearch()"
    [attr.placeholder]="placeholder"
    aria-label="שורת חיפוש"
  />

  <button type="button" (click)="onSearch()" aria-label="חפש">
    <mat-icon aria-hidden="true">search</mat-icon>
  </button>

  <div *ngIf="results.length" class="results-dropdown" role="listbox">
    <div
      *ngFor="let r of results; let i = index"
      class="result-item"
      role="option"
      (click)="navigateTo(r)"
      [attr.aria-posinset]="i + 1"
      [attr.aria-setsize]="results.length"
    >
      {{ r.title }}
    </div>
  </div>
</div>
