<section class="programs" dir="rtl" aria-labelledby="programsTitle">
  <header class="programs__header">
    <h2 id="programsTitle" class="programs__title">{{ title() }}</h2>
    <small class="programs__subtitle" *ngIf="subtitle()">{{ subtitle() }}</small>
  </header>

  <div class="programs__stage" #stage>
    <ul class="programs__grid" role="list">
      <li class="card" *ngFor="let item of items()">
        <!-- כל הכרטיס לחיץ (גם וידאו) -->
        <a class="card__link"
           [href]="resolve(item.href)"
           target="_blank"
           rel="noopener"
           [attr.aria-label]="item.title"
           [title]="item.title">

          <div class="card__media">
            <div class="card__icon">
              <!-- מסמך -->
              <svg *ngIf="item.kind!=='video'" viewBox="0 0 98 137" class="doc" aria-hidden="true">
                <rect x="0.5" y="0.5" width="97" height="136" rx="8" fill="none" stroke="#C9D2E8"/>
                <rect x="19.5" y="30" width="59.9" height="20.2" rx="3.8" fill="#D9D9D9"/>
                <rect x="14" y="16" width="70" height="105" rx="8" fill="none" stroke="#192A4A" stroke-width="2"/>
                <rect x="19.46" y="40" width="59.08" height="10" rx="3" fill="#192A4A" />
                <rect x="19.46" y="52" width="59.08" height="10" rx="3" fill="#192A4A" opacity=".85"/>
                <rect x="19.46" y="64" width="38" height="10" rx="3" fill="#192A4A" opacity=".7"/>
              </svg>

              <!-- וידאו -->
              <svg *ngIf="item.kind==='video'" viewBox="0 0 114 114" class="play" aria-hidden="true">
                <circle cx="57" cy="57" r="57" fill="#F6F6F6"/>
                <circle cx="57" cy="57" r="51.5" fill="none" stroke="#192A4A" stroke-width="3"/>
                <path d="M48 40 L80 57 L48 74 Z" fill="#192A4A"/>
              </svg>
            </div>
          </div>

          <div class="card__footer">
            <div class="card__title" [title]="item.title">{{ item.title }}</div>
            <div class="card__sub" *ngIf="item.subtitle">{{ item.subtitle }}</div>
          </div>
        </a>
      </li>
    </ul>
  </div>
</section>
